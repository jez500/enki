name: base-images

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'docker/build-base.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php-builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          target: php-builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: jez500/enki-base:php-builder
          cache-from: type=gha,scope=php-builder
          cache-to: type=gha,mode=max,scope=php-builder

      - name: Build and push frontend-builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          target: frontend-builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: jez500/enki-base:frontend-builder
          cache-from: type=gha,scope=frontend-builder
          cache-to: type=gha,mode=max,scope=frontend-builder

      - name: Build and push runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: jez500/enki-base:runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
