services:
  app:
    image: jez500/enki:latest
    ports:
      - "8080:8080"
    volumes:
      - enki_database:/var/www/database
      - enki_storage:/var/www/storage
    environment:
      APP_URL: http://localhost:8080

      # ── Google SSO ─────────────────────────────────────────────────────────
      # When set, email/password login is disabled and users sign in via Google.
      # GOOGLE_CLIENT_ID: your-client-id.apps.googleusercontent.com
      # GOOGLE_CLIENT_SECRET: your-client-secret
      # GOOGLE_REDIRECT_URI: http://localhost:8080/auth/google/callback
      # GOOGLE_ALLOWED_DOMAINS: yourcompany.com   # leave unset to allow all

      # ── GitHub integration ─────────────────────────────────────────────────
      # Enables importing skills from private GitHub repositories.
      # GITHUB_TOKEN: your-personal-access-token

      # ── MySQL / MariaDB ────────────────────────────────────────────────────
      # SQLite is used by default. To switch to MySQL/MariaDB, uncomment and
      # add a db service (see docs/configuration.md for a full example).
      # DB_CONNECTION: mysql
      # DB_HOST: db
      # DB_PORT: 3306
      # DB_DATABASE: enki
      # DB_USERNAME: enki
      # DB_PASSWORD: secret

      # ── Production ─────────────────────────────────────────────────────────
      # Generate once and persist to avoid breaking sessions on redeploy:
      #   docker run --rm jez500/enki:latest php artisan key:generate --show
      # APP_KEY: base64:...

volumes:
  enki_database:
  enki_storage:
